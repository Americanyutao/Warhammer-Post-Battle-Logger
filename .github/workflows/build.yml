name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run offline tests
        run: python -B tools/test_ci.py
      - name: Check report JavaScript syntax
        run: node --check src/report_view.js
      - name: Build tray application
        run: python -B tools/build_release.py
      - name: Check packaged application without a desktop or game
        run: python -B tools/check_release.py --headless
      - name: Upload complete application folder
        uses: actions/upload-artifact@v7
        with:
          name: WH3BattleLogger-Windows-x64
          path: release/WH3BattleLogger/
          if-no-files-found: error
          retention-days: 14


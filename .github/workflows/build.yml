name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and prepare as a draft (leave blank for build only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python -B -c "import os,re,runpy; tag=os.environ['RELEASE_TAG']; version=runpy.run_path('src/version.py')['VERSION']; assert re.fullmatch(r'v\d+\.\d+\.\d+',tag) and tag=='v'+version, 'Release tag must match src/version.py'"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run offline tests
        run: python -B tools/test_ci.py
      - name: Check report JavaScript syntax
        run: node --check src/report_view.js
      - name: Build tray application
        run: python -B tools/build_release.py
      - name: Check packaged application without a desktop or game
        run: python -B tools/check_release.py --headless
      - name: Package release ZIP and incremental update manifest
        run: python -B tools/package_update.py
      - name: Upload release ZIP and update manifest
        uses: actions/upload-artifact@v7
        with:
          name: WH3BattleLogger-release-files
          path: build/publish/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Prepare draft release
    needs: windows
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: draft-release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v8
        with:
          name: WH3BattleLogger-release-files
          path: build/publish
      - name: Attach tested files to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python3 -B tools/prepare_github_release.py

